name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff6aa2&color_dots=%23fff7fb,%23ffe0ef,%23ffc2dc,%23ff97c2,%23ff6aa2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff8fb7&color_dots=%23151b2d,%2324374d,%23306070,%234ca3a3,%23ff8fb7

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
